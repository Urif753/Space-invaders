services:
  - type: web
    name: space-invaders-online
    runtime: node
    rootDir: space-invaders-render
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: space-invaders-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true

databases:
  - name: space-invaders-db
    plan: free
    databaseName: space_invaders
    user: space_invaders
